<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>فرم ثبت‌نام</title>
  <style>
    body { font-family: Tahoma, sans-serif; background: #eef3f7; margin: 0; padding: 24px; }
    form { max-width: 420px; margin: auto; background: #fff; padding: 24px; border-radius: 8px; border: 1px solid #c9d6e2; }
    h1 { font-size: 22px; color: #1d4e6f; margin-top: 0; }
    label { display: block; margin: 14px 0 4px; }
    input, select, textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #aab; border-radius: 4px; font: inherit; }
    .radio label { display: inline; margin-left: 12px; }
    .radio input { width: auto; }
    button { margin-top: 18px; width: 100%; padding: 10px; background: #1d4e6f; color: #fff; border: 0; border-radius: 4px; font-size: 16px; cursor: pointer; }
    button:focus, input:focus, select:focus, textarea:focus { outline: 2px solid #3b8bc0; }
  </style>
</head>
<body>
  <form action="#" method="post">
    <h1>فرم ثبت‌نام</h1>

    <label for="name">نام و نام خانوادگی</label>
    <input type="text" id="name" name="name" required>

    <label for="email">ایمیل</label>
    <input type="email" id="email" name="email" required>

    <label for="password">رمز عبور</label>
    <input type="password" id="password" name="password" minlength="6" required>

    <label for="birth">تاریخ تولد</label>
    <input type="date" id="birth" name="birth">

    <label>جنسیت</label>
    <div class="radio">
      <input type="radio" id="f" name="gender" value="female"><label for="f">زن</label>
      <input type="radio" id="m" name="gender" value="male"><label for="m">مرد</label>
    </div>

    <label for="city">شهر</label>
    <select id="city" name="city">
      <option>تهران</option>
      <option>اصفهان</option>
      <option>شیراز</option>
      <option>مشهد</option>
    </select>

    <label for="msg">توضیحات</label>
    <textarea id="msg" name="msg" rows="4"></textarea>

    <label><input type="checkbox" required style="width:auto"> قوانین را می‌پذیرم</label>

    <button type="submit">ثبت‌نام</button>
  </form>
</body>
</html>
